# ============================================================
# Render.com Blueprint Specification
# Deploys Aegis One FastAPI Backend + pgvector Database
# ============================================================

services:
  - type: web
    name: aegis-warroom-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-warroom-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: '["https://aegis-warroom.vercel.app","http://localhost:3000"]'

databases:
  - name: aegis-warroom-db
    plan: standard
    region: oregon
    postgresMajorVersion: 16
